<!DOCTYPE html>
<html lang="zh-Hant-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太座喜樂查經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .loading-spinner { border: 4px solid #374151; border-top: 4px solid #db2777; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4">

    <!-- 設定頁 -->
    <div id="setup-view" class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-6 text-pink-400">親愛的玲玲，平安</h1>
        <input type="password" id="api-key" placeholder="請貼上最新的 Gemini API Key" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-600 mb-4 text-white">
        <button onclick="saveApiKey()" class="w-full py-4 bg-pink-600 rounded-lg font-bold text-lg text-white">開始使用</button>
    </div>

    <!-- 主選單 -->
    <div id="main-view" class="hidden w-full max-w-sm text-center space-y-4">
        <h2 id="status-text" class="text-xl text-pink-300">今天心情如何？</h2>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="askAI('心情悶')" class="p-4 bg-gray-800 rounded-xl">心情悶</button>
            <button onclick="askAI('煩躁忙')" class="p-4 bg-gray-800 rounded-xl">煩躁忙</button>
            <button onclick="askAI('健康')" class="p-4 bg-gray-800 rounded-xl">健康</button>
            <button onclick="askAI('家庭')" class="p-4 bg-gray-800 rounded-xl">家庭</button>
            <button onclick="askAI('親子')" class="p-4 bg-gray-800 rounded-xl">親子</button>
            <button onclick="askAI('夫妻相處')" class="p-4 bg-gray-800 rounded-xl">夫妻相處</button>
            <button onclick="askAI('朋友')" class="p-4 bg-gray-800 rounded-xl">朋友</button>
            <button onclick="askAI('想老公')" class="p-4 bg-gray-800 rounded-xl">想老公</button>
        </div>
        <button id="mic-btn" onclick="startVoice()" class="w-full py-4 bg-blue-600 rounded-2xl font-bold text-xl text-white">🎤 按下麥克風 (說完請講「完畢」)</button>
        <button onclick="showSetup()" class="w-full py-2 text-gray-500 text-sm underline">重新設定 API Key</button>
    </div>

    <!-- 結果頁 -->
    <div id="result-view" class="hidden w-full h-full flex flex-col p-2">
        <div id="card" class="bg-gray-800 p-6 rounded-3xl border-2 border-pink-500 overflow-y-auto flex-grow mb-4 text-left">
            <h3 class="text-pink-300 font-bold mb-2">親愛的玲玲 平安</h3>
            <div id="result-content" class="text-lg leading-relaxed"></div>
        </div>
        <div class="space-y-3">
            <button id="speak-toggle" onclick="toggleSpeak()" class="w-full py-5 bg-green-600 rounded-2xl font-bold text-xl text-white">🔊 大聲朗讀給太座聽</button>
            <button onclick="showMain()" class="w-full py-5 bg-gray-700 rounded-2xl font-bold text-xl text-white">❤️ 返回重新查詢</button>
        </div>
    </div>

    <script>
        const TARGET_MODEL = "gemini-3.5-flash";

        function showSetup() {
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('setup-view').classList.remove('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            if(key) { localStorage.setItem('gemini_key', key); showMain(); }
        }

        function showMain() {
            window.speechSynthesis.cancel();
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
        }

        async function askAI(query) {
            const key = localStorage.getItem('gemini_key');
            const contentDiv = document.getElementById('result-content');
            const btns = document.querySelectorAll('button');
            
            btns.forEach(b => b.disabled = true);
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            contentDiv.innerHTML = `<div class="text-center"><div class="loading-spinner mx-auto my-4"></div><p>老公正在連線天父的愛...</p></div>`;

            try {
                // 使用串流 API 端點
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${TARGET_MODEL}:streamGenerateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: `你是老公，用溫柔親切的語氣，針對「${query}」這個話題，給予安慰與聖經金句（合和本），字數100~200字。開頭請寫「親愛的玲玲 平安」。直接給內容，不需自我介紹。` }] }] })
                });

                if (!response.ok) throw new Error("API 請求失敗");

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                contentDiv.innerHTML = ""; // 清空載入中狀態

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    // Gemini 串流格式處理
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.replace('data: ', ''));
                                contentDiv.innerText += data.candidates[0].content.parts[0].text;
                            } catch(e) {}
                        }
                    }
                }
            } catch (err) {
                contentDiv.innerHTML = `<div class="text-red-400">連線失敗：${err.message}</div>`;
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }

        function startVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("此設備不支援語音辨識"); return; }
            
            const rec = new SpeechRecognition();
            rec.lang = 'zh-TW';
            rec.continuous = true;
            rec.interimResults = true;
            
            let finalBuffer = "";
            rec.onresult = (e) => {
                let transcript = "";
                for (let i = e.resultIndex; i < e.results.length; ++i) transcript += e.results[i][0].transcript;
                document.getElementById('status-text').innerText = "🎙️ 正在聽: " + transcript;
                finalBuffer = transcript;
                if (finalBuffer.includes("完畢")) {
                    rec.stop();
                    askAI(finalBuffer.replace("完畢", ""));
                }
            };
            rec.start();
        }

        function toggleSpeak() {
            if (window.speechSynthesis.speaking && !window.speechSynthesis.paused) {
                window.speechSynthesis.pause();
                document.getElementById('speak-toggle').innerText = "▶️ 繼續朗讀";
            } else if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
                document.getElementById('speak-toggle').innerText = "⏸️ 暫停朗讀";
            } else {
                const msg = new SpeechSynthesisUtterance(document.getElementById('result-content').innerText);
                const voices = window.speechSynthesis.getVoices();
                msg.voice = voices.find(v => v.lang.includes('zh-TW') && (v.name.toLowerCase().includes('male') || v.name.includes('男'))) || voices[0];
                msg.rate = 0.7;
                msg.pitch = 0.6;
                window.speechSynthesis.speak(msg);
                document.getElementById('speak-toggle').innerText = "⏸️ 暫停朗讀";
            }
        }

        if (localStorage.getItem('gemini_key')) showMain();
    </script>
</body>
</html>
