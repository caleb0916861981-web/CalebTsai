<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>太座喜樂查經介面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fdfbf7',
              100: '#fbf7ed',
              200: '#f4e9cf',
              300: '#eddcb1',
              400: '#e1bf75',
              500: '#d4a338',
              600: '#bf9232',
              700: '#9f7a2a',
              800: '#7f6221',
              900: '#68501b',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 強化手機版動態視窗高度 (Dynamic Viewport Height)，徹底避開 Safari 工具列與虛擬鍵盤擠壓 */
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #030712; /* slate-950 */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 麥克風錄音動態呼吸效果 */
    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); }
    }
    .mic-active {
      animation: pulse-mic 1.2s infinite;
      background-color: #ef4444 !important;
    }

    /* 精美電子賀卡發光特效 */
    .premium-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(20, 15, 45, 0.98) 100%);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 25px rgba(212, 163, 56, 0.25);
    }
    
    /* 漸變金文字 */
    .gold-text-gradient {
      background: linear-gradient(to right, #ffe17d, #d4a338, #f5d061);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 頁面切換過渡動畫 */
    .screen-transition {
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    }
    .screen-hidden {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col justify-between h-full w-full select-none">

  <!-- 頂部列：固定高度，防壓迫 -->
  <header class="h-14 shrink-0 flex items-center justify-between px-4 bg-slate-900/75 border-b border-slate-800/80 backdrop-blur-md z-10">
    <div class="flex items-center gap-2">
      <!-- 溫暖愛心圖示 -->
      <svg class="w-6 h-6 text-rose-500 fill-current animate-pulse" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <h1 class="text-lg font-bold tracking-wider gold-text-gradient">太座喜樂查經</h1>
    </div>
    <div class="flex items-center gap-2">
      <!-- 金鑰管理按鈕（若無 Key 則顯示閃爍紅點提示） -->
      <button onclick="showKeyModal()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all relative" title="設定金鑰">
        <span id="keyBadge" class="hidden absolute top-0 right-0 h-2.5 w-2.5 rounded-full bg-rose-500 animate-ping"></span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>
  </header>

  <!-- 主內容視窗容器：自動適應一頁，解決虛擬鍵盤擠壓 -->
  <main class="flex-1 relative w-full overflow-hidden">

    <!-- 搜尋與心境選擇頁面 -->
    <div id="searchScreen" class="screen-transition h-full w-full flex flex-col justify-between p-4">
      
      <!-- 快捷查經 8 大區塊：置中且防止壓縮 -->
      <div class="flex-1 flex flex-col justify-center gap-2 overflow-y-auto">
        <div class="text-center py-1">
          <span class="text-sm text-amber-300/90 font-semibold tracking-wide">✨ 親愛的玲玲，點選妳此時的心境，讓神安慰妳：</span>
        </div>
        
        <!-- 巨型自適應按鈕網格 (限制最小高度防止鍵盤彈出時過度壓縮) -->
        <div class="grid grid-cols-2 gap-3 max-w-md mx-auto w-full px-1 min-h-[260px]">
          <button onclick="quickSearch('心情悶')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">🌧️</span>
            <span class="text-sm font-bold text-slate-100">心情有些悶</span>
          </button>
          <button onclick="quickSearch('煩躁忙')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">⚡</span>
            <span class="text-sm font-bold text-slate-100">感到煩躁忙</span>
          </button>
          <button onclick="quickSearch('健康')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">🩺</span>
            <span class="text-sm font-bold text-slate-100">求身體健康</span>
          </button>
          <button onclick="quickSearch('家庭')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">🏠</span>
            <span class="text-sm font-bold text-slate-100">求家庭和樂</span>
          </button>
          <button onclick="quickSearch('親子')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">👶</span>
            <span class="text-sm font-bold text-slate-100">育親子智慧</span>
          </button>
          <button onclick="quickSearch('夫妻相處')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">💖</span>
            <span class="text-sm font-bold text-slate-100">談夫妻相處</span>
          </button>
          <button onclick="quickSearch('朋友')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">🤝</span>
            <span class="text-sm font-bold text-slate-100">交朋友互動</span>
          </button>
          <button onclick="quickSearch('想老公')" class="quick-btn h-14 flex items-center gap-3 bg-slate-900/95 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-2xl">💌</span>
            <span class="text-sm font-bold text-slate-100">今天想老公</span>
          </button>
        </div>
      </div>

      <!-- 文字與語音輸入區：固定高度，不被壓縮 -->
      <div class="shrink-0 mt-2 flex items-center gap-3 max-w-md mx-auto w-full pb-4">
        <!-- 麥克風按鈕 -->
        <button id="micBtn" onclick="toggleSpeech()" class="h-14 w-14 rounded-full bg-amber-500 hover:bg-amber-600 flex items-center justify-center shrink-0 transition-all shadow-lg shadow-amber-500/20 active:scale-95" title="語音輸入">
          <svg id="micIcon" class="w-7 h-7 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>
        <!-- 文字框與送出鍵 -->
        <div class="flex-1 flex items-center bg-slate-900 border border-slate-700/80 rounded-full h-14 px-4 focus-within:border-amber-500 transition-all shadow-inner">
          <input id="userInput" type="text" placeholder="跟老公說點心事，或按麥克風..." class="bg-transparent flex-1 outline-none text-base text-slate-100 placeholder-slate-500">
          <button id="sendBtn" onclick="triggerSearch()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-amber-400 active:scale-95" title="發送詢問">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 卡片與朗讀呈現頁面 -->
    <div id="resultScreen" class="screen-transition screen-hidden h-full w-full flex flex-col justify-between p-4">
      
      <!-- 賀卡主體：使用彈性高度自適應螢幕 -->
      <div id="cardContainer" class="premium-card rounded-3xl border border-amber-500/35 p-5 flex-1 flex flex-col justify-between overflow-hidden relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(212,163,56,0.08),transparent_65%)] pointer-events-none"></div>
        
        <!-- 卡片內容：自動計算剩餘高度並支援內部滾動 -->
        <div class="overflow-y-auto flex-1 flex flex-col justify-center text-center py-2 px-1" id="cardContentScroll">
          <div id="cardContent" class="space-y-4">
            <!-- 內容動態填充 -->
          </div>
        </div>

        <!-- 朗讀控制、複製與返回按鈕區 -->
        <div class="pt-4 border-t border-slate-800/80 flex flex-col gap-2 shrink-0">
          <!-- 巨型朗讀按鈕 -->
          <button id="ttsBtn" onclick="speakOutput()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-98 text-slate-950 font-bold text-xl flex items-center justify-center gap-3 shadow-xl shadow-amber-500/25 transition-all">
            <span class="text-2xl">🗣️</span>
            <span>大聲朗讀給太座聽 💖</span>
          </button>
          
          <div class="flex gap-2">
            <!-- 複製安慰語按鈕 (高相容性 Fallback) -->
            <button onclick="copyComfortText()" class="flex-1 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 hover:bg-slate-700 text-amber-300 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95">
              <span>📋</span>
              <span>複製溫馨語錄</span>
            </button>
            
            <!-- 回首頁按鈕 -->
            <button onclick="goBackToSearch()" class="flex-1 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 hover:bg-slate-800 text-rose-400 font-semibold text-xs flex items-center justify-center gap-1.5 transition-all active:scale-95">
              <span>❤️</span>
              <span>回到重新查詢</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 全域載入中鎖定畫面 -->
  <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center z-50">
    <div class="relative flex items-center justify-center mb-6">
      <div class="animate-spin rounded-full h-20 w-20 border-t-4 border-b-4 border-amber-500"></div>
      <span class="absolute text-2xl animate-bounce">❤️</span>
    </div>
    <p id="loadingText" class="text-amber-300 font-bold text-xl animate-pulse text-center px-6 leading-relaxed">
      老公正在為妳翻查聖經求亮光，等我一下喔...
    </p>
  </div>

  <!-- API KEY 設定對話盒 -->
  <div id="keyModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
      <div class="text-center">
        <span class="text-4xl">🔑</span>
        <h3 class="text-xl font-bold text-amber-300 mt-2">設定 Gemini API 金鑰</h3>
        <p class="text-xs text-slate-400 mt-2 leading-relaxed">
          為保護隱私，您的金鑰將儲存在此瀏覽器本機。更新網頁或程式碼不需重複輸入。
        </p>
      </div>
      <div>
        <input id="apiKeyInput" type="password" placeholder="請貼上您的 Gemini API Key" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 outline-none focus:border-amber-500">
      </div>
      <div class="flex gap-3">
        <button onclick="saveApiKey()" class="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold transition-all text-sm">儲存金鑰</button>
        <button onclick="hideKeyModal()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all text-sm">取消</button>
      </div>
    </div>
  </div>

  <!-- 提示浮動訊息 (Toast) -->
  <div id="toast" class="opacity-0 pointer-events-none fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-amber-500/50 text-amber-300 text-xs px-5 py-3 rounded-full shadow-2xl transition-all duration-300 z-50 flex items-center gap-2">
    <span>💡</span>
    <span id="toastMsg"></span>
  </div>

  <script>
    // 固定的本機儲存 Key
    const STORAGE_KEY = "WIFE_DEVOTIONAL_GEMINI_KEY";
    let geminiApiKey = localStorage.getItem(STORAGE_KEY) || "";

    // 內部提示詞：資深神學院背景老公
    const systemPrompt = `你是中華神學院的資深教授老師，此時你只扮演最體貼溫柔的老公。
你的所有回覆深度與神學啟發，都必須參考並符合網頁 ccbible 查經網站（https://ccbiblestudy.net/index-T.htm）所強調的：靈修培育、讀經扎根與和合本聖經真理。

請依照下列嚴格格式輸出：
1. 第一段：以老公溫慢、極具同理心、緩慢且親切的語調，寫出 100~200 字的安慰打氣話語。必須貼合太座提問的心境，給予全然的接納與支持，不要有任何前言、老公的自我介紹。
2. 空一行。
3. 第二段：引用一句最貼切的聖經和合本經文，並在括號內附上精確的卷章節（例如：腓立比書 4:6-7）。

回覆限制：絕對不要寫任何開頭問候語(如"老婆好")或結尾語，也不需要提及你是神學院老師。直接輸出上述兩段內容。`;

    // 語音輸入全域變數與防打結鎖
    let recognition = null;
    let isListening = false;
    let isManualCancel = false; 

    window.onload = function() {
      checkKeyBadge();
      if (!geminiApiKey) {
        setTimeout(() => { showKeyModal(); }, 800);
      } else {
        showToast("已成功讀取本機裝置儲存的 API 金鑰");
      }
    };

    function checkKeyBadge() {
      const badge = document.getElementById('keyBadge');
      if (!geminiApiKey) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 4500);
    }

    // 每次點擊錄音時動態載入，100% 根治 iOS 睡眠、背景切換與 API 崩潰 Bug
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        return null;
      }

      const recInstance = new SpeechRecognition();
      recInstance.continuous = false;
      recInstance.lang = 'zh-TW';
      recInstance.interimResults = false;
      recInstance.maxAlternatives = 1;

      recInstance.onstart = function() {
        isListening = true;
        isManualCancel = false;
        document.getElementById('micBtn').classList.add('mic-active');
        document.getElementById('userInput').placeholder = "老公正在聽，請對著手機說話...";
      };

      recInstance.onerror = function(e) {
        console.error("語音輸入錯誤:", e.error);
        stopSpeechUI();
        
        // 如果是手動取消導致的異常，直接靜音忽略，避免跳出錯誤提示打擾太座
        if (isManualCancel) return;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const inIframe = window.self !== window.top;

        if (e.error === 'not-allowed') {
          if (isIOS) {
            showToast("🍎 iPhone 麥克風權限被阻擋。請至「設定」>「Safari」>「麥克風」將其設定為「允許」。");
          } else {
            showToast("麥克風權限被拒絕，請在瀏覽器設定中開放麥克風存取權限。");
          }
        } else if (e.error === 'network') {
          if (isIOS) {
            if (inIframe) {
              showToast("🍎 執行診斷提示：iPhone Safari 不支援在預覽視窗中語音辨識。請點擊右上角在新分頁開啟，或直接手動輸入喔！");
            } else {
              showToast("🍎 iPhone 聽寫連線失敗。請確認：1. 設定 > 一般 > 鍵盤 > 啟用聽寫 已打開。2. 務必使用 Safari 原生瀏覽器打開。");
            }
          } else {
            showToast("語音辨識網路連線異常，請確認網路穩定後重試。");
          }
        } else if (e.error === 'no-speech') {
          showToast("沒有聽到聲音，請靠近麥克風再試一次");
        } else if (e.error === 'audio-capture') {
          showToast("手機音訊裝置被佔用，請關閉其他通話或音樂軟體後重試。");
        } else {
          showToast("語音辨識未就緒，推薦直接鍵盤輸入更快速喔！");
        }
      };

      recInstance.onend = function() {
        stopSpeechUI();
      };

      recInstance.onresult = function(event) {
        if (isManualCancel) return;
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        showToast("已收到太座的傾訴：" + text);
        triggerSearch();
      };

      return recInstance;
    }

    function toggleSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        showToast("此手機裝置的瀏覽器未開放或不支援麥克風語音輸入");
        return;
      }

      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
        showToast("⚠️ 安全提示：手機系統限制必須在 HTTPS 安全網址下才能啟用錄音辨識！");
      }

      if (isListening) {
        isManualCancel = true; // 鎖定狀態：防止中途結束被當成說話結束
        if (recognition) {
          try {
            recognition.abort(); // 強制放棄硬體，並釋放
          } catch(e) {}
        }
        stopSpeechUI();
      } else {
        // iPhone 系統錄音通道極致排他優化：啟動錄音前先釋放大聲朗讀
        window.speechSynthesis.cancel();

        recognition = initSpeechRecognition();
        if (!recognition) {
          showToast("語音辨識模組無法載入，建議直接手動輸入");
          return;
        }

        try {
          recognition.start();
        } catch (e) {
          console.error("啟動辨識失敗", e);
          showToast("錄音啟動失敗，請重新載入或使用手動輸入。");
        }
      }
    }

    function stopSpeechUI() {
      isListening = false;
      document.getElementById('micBtn').classList.remove('mic-active');
      document.getElementById('userInput').placeholder = "跟老公說點心事，或直接按麥克風...";
    }

    // 秒級超時與極速降級輪替
    async function fetchWithTimeoutAndRetry(url, options, retries = 1, delay = 500, timeoutMs = 4000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      
      const updatedOptions = { ...options, signal: controller.signal };
      
      try {
        const response = await fetch(url, updatedOptions);
        clearTimeout(id);
        
        if (!response.ok) {
          if (response.status === 400 || response.status === 403 || response.status === 404 || response.status === 429) {
            throw response;
          }
          if (retries > 0) {
            await new Promise(resolve => setTimeout(resolve, delay));
            return await fetchWithTimeoutAndRetry(url, options, retries - 1, delay * 1.5, timeoutMs);
          }
          throw response;
        }
        return response;
      } catch (error) {
        clearTimeout(id);
        if (retries > 0 && error.name !== 'AbortError') {
          await new Promise(resolve => setTimeout(resolve, delay));
          return await fetchWithTimeoutAndRetry(url, options, retries - 1, delay * 1.5, timeoutMs);
        }
        throw error;
      }
    }

    async function executeGeminiQuery(userQuery) {
      setInterfaceLocked(true);
      window.speechSynthesis.cancel();

      // 【極致相容性輪替鏈】優先度：1.5-flash (超廣泛適用) ➔ 2.5-flash (穩定第一) ➔ 1.5-pro (深度備案)
      const models = [
        "gemini-1.5-flash",
        "gemini-2.5-flash",
        "gemini-1.5-pro"
      ];
      
      let lastError = null;
      let success = false;

      for (let i = 0; i < models.length; i++) {
        const model = models[i];
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiApiKey}`;
        
        let loadingMsg = "老公正在為妳翻查聖經求亮光，等我一下喔...";
        if (i > 0) {
          loadingMsg = "老公正在調用備用智慧經卷，再等我一下下喔...";
        }
        document.getElementById('loadingText').innerText = loadingMsg;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        try {
          // 對於單一模型不拖延，4秒不給回應立即判定切換下一級
          const response = await fetchWithTimeoutAndRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }, 0, 500, 4000); 

          const result = await response.json();
          const responseText = result.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (responseText) {
            displayResultCard(responseText);
            success = true;
            break;
          } else {
            throw new Error("Format error");
          }
        } catch (err) {
          console.warn(`[智慧多模型自動調度] 模型 ${model} 連線不順，自動切換下一級別。`, err);
          lastError = err;
          continue;
        }
      }

      if (!success) {
        handleFinalError(lastError);
      }

      setInterfaceLocked(false);
    }

    function handleFinalError(err) {
      if (err instanceof Response) {
        const statusCode = err.status;
        let title = "連線失敗";
        let explanation = "";

        switch (statusCode) {
          case 400:
            title = "金鑰格式錯誤 (400 Bad Request)";
            explanation = "您的 API 金鑰格式可能不正確，請點選右上角齒輪按鈕重新輸入檢查。";
            break;
          case 403:
            title = "金鑰效期或權限限制 (403 Forbidden)";
            explanation = "您的 API 金鑰無權訪問，請前往 Google AI Studio 檢查金鑰狀態是否被封禁或異常。";
            break;
          case 404:
            title = "找不到可用的模型端點 (404 Not Found)";
            explanation = "我們嘗試了所有相容的智慧模型，但因金鑰權限問題均被 404 回絕。這通常意味著該金鑰已被停用，請前往 Google AI Studio 建立一個全新的 Key！";
            break;
          case 429:
            title = "AI 請求額度用盡 (429 Rate Limit)";
            explanation = "今天這組金鑰的請求次數已達 Google 免費額度上限，請休息幾分鐘後再試試。";
            break;
          default:
            title = `伺服器連線錯誤 (代碼: ${statusCode})`;
            explanation = "發生了未知的伺服器通訊錯誤，請稍後重試。";
        }
        showDebugError(title, explanation);
      } else {
        showDebugError(
          "網路連線超時或受阻",
          "連接 Google API 超時（超過 4 秒未回應），或是手機目前沒有網際網路連線、或者您的網域遭防火牆阻擋。請檢查連線狀態。"
        );
      }
    }

    function displayResultCard(text) {
      const cardContent = document.getElementById('cardContent');
      const paragraphs = text.split('\n').filter(p => p.trim() !== '');

      let htmlContent = `<div class="space-y-4">`;
      // 客製化專屬發光抬頭
      htmlContent += `
        <div class="text-base md:text-lg tracking-widest text-amber-300 font-extrabold mb-1 drop-shadow-[0_0_8px_rgba(212,163,56,0.5)]">
          💖 親愛的玲玲 平安 💖
        </div>
      `;

      paragraphs.forEach((p, idx) => {
        if (p.includes('(') || p.includes('（') || p.includes('：') || p.includes(':') || idx === paragraphs.length - 1) {
          htmlContent += `
            <div class="my-3 p-4 rounded-2xl bg-slate-900/90 border-l-4 border-amber-500 shadow-md">
              <p id="bibleQuote" class="text-amber-200 text-base md:text-lg font-medium leading-relaxed italic">「 ${p} 」</p>
            </div>
          `;
        } else {
          htmlContent += `
            <p class="text-slate-100 text-lg font-semibold leading-relaxed drop-shadow text-justify">
              ${p}
            </p>
          `;
        }
      });

      htmlContent += `</div>`;
      cardContent.innerHTML = htmlContent;

      switchScreen('result');
      document.getElementById('userInput').value = "";
    }

    // 複製安慰語錄功能 (高度相容 fallback 機制，可在任何 iframe/App 內置瀏覽器中成功運行)
    function copyComfortText() {
      const cardContentText = document.getElementById('cardContent').innerText;
      const textToCopy = cardContentText
        .replace("💖 親愛的玲玲 平安 💖", "親愛的玲玲 平安。")
        .trim();

      const tempTextArea = document.createElement("textarea");
      tempTextArea.value = textToCopy;
      tempTextArea.style.position = "fixed";
      tempTextArea.style.opacity = "0";
      document.body.appendChild(tempTextArea);
      
      tempTextArea.select();
      tempTextArea.setSelectionRange(0, 99999);

      try {
        const successful = document.execCommand("copy");
        if (successful) {
          showToast("📋 已成功將溫馨語錄複製到您的剪貼簿囉！");
        } else {
          throw new Error("Unable to copy");
        }
      } catch (err) {
        console.error("複製失敗: ", err);
        showToast("複製失敗，請長按文字進行手動選取複製");
      }
      
      document.body.removeChild(tempTextArea);
    }

    function showDebugError(title, explanation) {
      const cardContent = document.getElementById('cardContent');
      
      cardContent.innerHTML = `
        <div class="p-4 rounded-2xl bg-rose-950/40 border border-rose-500/40 text-center space-y-4">
          <div class="text-4xl">⚠️</div>
          <h3 class="text-lg font-bold text-rose-300">${title}</h3>
          <p class="text-sm text-slate-300 leading-relaxed">${explanation}</p>
          <div class="pt-2 flex justify-center gap-3">
            <button onclick="goBackToSearch()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all">
              重新輸入
            </button>
            <button onclick="showKeyModal()" class="px-5 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-slate-950 text-xs font-bold transition-all">
              更換 API Key
            </button>
          </div>
        </div>
      `;
      switchScreen('result');
    }

    function switchScreen(screen) {
      const searchScreen = document.getElementById('searchScreen');
      const resultScreen = document.getElementById('resultScreen');

      if (screen === 'search') {
        resultScreen.classList.add('screen-hidden');
        searchScreen.classList.remove('screen-hidden');
      } else {
        searchScreen.classList.add('screen-hidden');
        resultScreen.classList.remove('screen-hidden');
      }
    }

    function goBackToSearch() {
      window.speechSynthesis.cancel();
      switchScreen('search');
    }

    function setInterfaceLocked(locked) {
      const overlay = document.getElementById('loadingOverlay');
      const micBtn = document.getElementById('micBtn');
      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');
      const quickBtns = document.querySelectorAll('.quick-btn');

      if (locked) {
        overlay.classList.remove('hidden');
        micBtn.disabled = true;
        sendBtn.disabled = true;
        userInput.disabled = true;
        quickBtns.forEach(btn => btn.disabled = true);
      } else {
        overlay.classList.add('hidden');
        micBtn.disabled = false;
        sendBtn.disabled = false;
        userInput.disabled = false;
        quickBtns.forEach(btn => btn.disabled = false);
      }
    }

    function quickSearch(theme) {
      let promptText = "";
      switch(theme) {
        case '心情悶': promptText = "親愛的老公，我今天心情有點悶，覺得提不起勁，求安慰與方向。"; break;
        case '煩躁忙': promptText = "親愛的老公，今天生活步調太快太雜，事情做好多，感到煩躁疲憊。"; break;
        case '健康': promptText = "親愛的老公，最近身體有些疲憊微恙，求能帶來健康平安的依靠與亮光。"; break;
        case '家庭': promptText = "親愛的老公，家裡打掃和繁雜的事不少，求家庭和樂與心靈的平靜。"; break;
        case '親子': promptText = "親愛的老公，看著大孩子的生活，求當個有智慧放手又關懷的媽媽。"; break;
        case '夫妻相處': promptText = "親愛的老公，求主看顧我們夫妻的心，給我們源源不絕親密與扶持的力量。"; break;
        case '朋友': promptText = "親愛的老公，求賜予人際關係的智慧，與朋友相處有恩慈、能互相信任。"; break;
        case '想老公': promptText = "親愛的老公，我今天特別想念你，求你對我說幾句溫慢深情的話。"; break;
        default: promptText = `我想查考關於：${theme}`;
      }
      document.getElementById('userInput').value = promptText;
      triggerSearch();
    }

    function triggerSearch() {
      const text = document.getElementById('userInput').value.trim();
      if (!text) {
        showToast("請先輸入您想查考的事或心情喔");
        return;
      }
      if (!geminiApiKey) {
        showToast("請先設定您的 Gemini API Key！");
        showKeyModal();
        return;
      }
      executeGeminiQuery(text);
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) {
        showToast("請輸入有效的 Gemini 金鑰喔！");
        return;
      }
      geminiApiKey = val;
      localStorage.setItem(STORAGE_KEY, val);
      showToast("金鑰儲存成功！同裝置更新不需重新輸入。");
      checkKeyBadge();
      hideKeyModal();
    }

    let currentUtterance = null;

    function speakOutput() {
      window.speechSynthesis.cancel();

      const cardContentText = document.getElementById('cardContent').innerText;
      const textToSpeak = cardContentText
        .replace("💖 親愛的玲玲 平安 💖", "親愛的玲玲 平安。")
        .replace(/「/g, "")
        .replace(/」/g, "")
        .trim();

      if (!textToSpeak) return;

      currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
      currentUtterance.rate = 0.80;   
      currentUtterance.pitch = 0.88;  

      const voices = window.speechSynthesis.getVoices();
      let selectedVoice = null;
      
      for (let i = 0; i < voices.length; i++) {
        const v = voices[i];
        if (v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.lang.includes('zh-CN')) {
          if (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('yating')) {
            selectedVoice = v;
            break;
          }
          if (!selectedVoice) selectedVoice = v;
        }
      }
      
      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      }

      const ttsBtn = document.getElementById('ttsBtn');
      const originalHtml = ttsBtn.innerHTML;
      
      currentUtterance.onstart = function() {
        ttsBtn.innerHTML = `
          <span class="animate-pulse">❤️ 老公正深情朗讀中... (點此停止)</span>
        `;
        ttsBtn.classList.remove('from-amber-500', 'to-amber-600');
        ttsBtn.classList.add('from-rose-500', 'to-rose-600');
      };

      currentUtterance.onend = function() {
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      currentUtterance.onerror = function() {
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      ttsBtn.onclick = function() {
        window.speechSynthesis.cancel();
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => {};
    }
  </script>
