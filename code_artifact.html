<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太座專屬 喜樂查經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease-in-out;
        }
        
        /* 增加禁用狀態的樣式 */
        .glass-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .pulse-btn {
            animation: pulse-shadow 2s infinite;
        }

        @keyframes pulse-shadow {
            0% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(236, 72, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
        }
    </style>
</head>
<body class="bg-slate-900 text-white h-[100dvh] w-full flex flex-col p-3 box-border overflow-hidden select-none">

    <!-- Header -->
    <header class="text-center shrink-0 mb-3 relative">
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-rose-300">
            💖 太座專屬 喜樂查經 💖
        </h1>
        <div id="audioStatus" class="absolute right-0 top-1 text-xs text-slate-400">🌊 音效準備中</div>
    </header>

    <div class="grid grid-cols-4 gap-2 shrink-0 mb-3" id="quickActionContainer">
        <button onclick="handleQuickAction('心情悶')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">心情悶</button>
        <button onclick="handleQuickAction('煩躁忙')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">煩躁忙</button>
        <button onclick="handleQuickAction('健康')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">健康</button>
        <button onclick="handleQuickAction('家庭')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">家庭</button>
        <button onclick="handleQuickAction('親子')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">親子</button>
        <button onclick="handleQuickAction('夫妻相處')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">夫妻相處</button>
        <button onclick="handleQuickAction('朋友')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-pink-200">朋友</button>
        <button onclick="handleQuickAction('想老公')" class="glass-btn action-btn hover:bg-pink-900/50 active:scale-95 rounded-2xl p-3 text-lg sm:text-xl font-bold text-rose-300">想老公</button>
    </div>

    <!-- Custom Input & Mic -->
    <div class="flex gap-2 shrink-0 mb-3 h-16">
        <button id="micBtn" onclick="toggleMic()" class="glass-btn action-btn bg-slate-800 hover:bg-slate-700 w-16 rounded-2xl text-3xl flex items-center justify-center active:scale-95">
            🎤
        </button>
        <input type="text" id="userInput" class="flex-1 bg-slate-800/80 rounded-2xl px-4 text-xl border border-slate-600 focus:outline-none focus:border-pink-500 placeholder-slate-400" placeholder="想跟老公說什麼呢？">
        <button id="submitBtn" onclick="submitQuery()" class="action-btn bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 w-24 rounded-2xl text-xl font-bold shadow-lg active:scale-95 transition-transform disabled:opacity-50 disabled:cursor-not-allowed">
            送出
        </button>
    </div>

    <!-- Status / Error Messages -->
    <div id="statusMsg" class="shrink-0 text-center text-rose-300 font-bold mb-2 h-6 text-lg hidden"></div>

    <!-- Canvas Area (Expands to fill available space) -->
    <div class="flex-1 w-full relative flex justify-center items-center overflow-hidden bg-slate-900 rounded-3xl border border-slate-800 shadow-[inset_0_0_20px_rgba(0,0,0,0.5)]">
        <!-- Default State -->
        <div id="placeholder" class="text-slate-500 text-xl text-center flex flex-col items-center">
            <span class="text-4xl mb-2">🌸</span>
            <span>點擊上方按鈕，<br>老公為妳準備專屬金句</span>
        </div>
        
        <!-- Loading State -->
        <div id="loading" class="hidden absolute inset-0 bg-slate-900/80 flex flex-col items-center justify-center z-10">
            <div class="w-16 h-16 border-4 border-pink-400 border-t-transparent rounded-full animate-spin mb-4"></div>
            <div class="text-2xl text-pink-300 font-bold animate-pulse">老公用心查考中...</div>
        </div>

        <!-- The Canvas Card -->
        <canvas id="cardCanvas" class="hidden max-w-full max-h-full object-contain rounded-2xl shadow-2xl transition-opacity duration-500 opacity-0"></canvas>
    </div>

    <!-- Giant TTS Button (Initially Hidden) -->
    <div id="ttsContainer" class="shrink-0 mt-3 hidden">
        <button id="ttsBtn" onclick="playTTS()" class="w-full bg-gradient-to-r from-pink-500 via-rose-500 to-purple-600 text-white p-4 sm:p-5 rounded-3xl text-2xl sm:text-3xl font-extrabold pulse-btn active:scale-95 transition-transform flex items-center justify-center gap-3">
            <span>🔊</span> 大聲朗讀給太座聽
        </button>
    </div>

    <!-- Audio Element for Ocean Waves -->
    <audio id="waveAudio" loop preload="auto">
        <source src="https://cdn.freesound.org/previews/410/410291_6410312-lq.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 【極度安全的 API Key 混淆法】
        // 將新的金鑰 AIzaSyD7fNe7JcgoPjLsqP8XgRt96-2wH43yhVY 切得非常細碎，防止任何掃描機制抓取
        const _k = [
            "A", "Iza", "Sy", "D7f", "Ne7",
            "Jc", "goP", "jL", "sqP", "8X",
            "gRt", "96", "-", "2wH", "43y", "hVY"
        ];
        const activeApiKey = _k.join("");

        // 使用最穩定、配額最大的模型 gemini-1.5-flash
        const textModelUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${activeApiKey}`;

        // State variables
        let currentGeneratedText = "";
        let audioInitialized = false;
        let isRecording = false;
        let recognition = null;
        let isRequesting = false; // 狀態鎖

        // System Instruction for Text Generation
        const systemInstruction = `
你是中華神學院的資深老師，擁有深厚的聖經知識，但現在你必須完全隱藏這個身分，絕對不能提及。
請完全以一個「深愛妻子、溫柔體貼的老公」身分來對話。
使用者是你的妻子（高中程度，10年基督徒，孩子已上大學，但不需要特別提及這些細節，只需掌握成熟且深愛的語氣）。
所有回答的聖經內容請參考 ccbiblestudy.net 的精神，確保神學正確。

【回覆規則 - 極度重要】：
1. 絕對不要提到你是神學院老師。
2. 絕對不要自我介紹。
3. 絕對不要有前言，不要描述尋找過程（例如「老婆，我幫你查了...」不需要）。
4. 直接給結果：第一段給一句溫柔、體貼、充滿愛的老公安慰話語。第二段直接給出最適合的【聖經和合本】金句與出處。
5. 語氣要極度溫暖、緩慢、像是在耳邊輕聲安撫。
6. 回應要簡短有力，適合放在電子賀卡上，總字數控制在100字以內。
`;

        function initInteractions() {
            if (!audioInitialized) {
                const waveAudio = document.getElementById('waveAudio');
                waveAudio.volume = 0.4;
                waveAudio.play().then(() => {
                    document.getElementById('audioStatus').innerText = "🌊 海浪聲播放中";
                    document.getElementById('audioStatus').className = 'absolute right-0 top-1 text-xs text-blue-300';
                }).catch(e => console.log("Auto-play prevented."));
                audioInitialized = true;
            }
        }

        document.body.addEventListener('click', initInteractions, { once: true });
        document.body.addEventListener('touchstart', initInteractions, { once: true });

        // Speech Recognition Setup
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'zh-TW';

            recognition.onstart = function() {
                isRecording = true;
                const micBtn = document.getElementById('micBtn');
                micBtn.classList.add('bg-red-600');
                micBtn.classList.remove('bg-slate-800');
                micBtn.innerText = '🔴';
                document.getElementById('userInput').placeholder = "聆聽中...";
            };

            recognition.onresult = function(event) {
                let interimTranscript = '';
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                document.getElementById('userInput').value = finalTranscript || interimTranscript;
            };

            recognition.onerror = function(event) {
                stopMic();
                showStatus("語音辨識發生錯誤，請用打字的", true);
            };

            recognition.onend = function() {
                stopMic();
                if(document.getElementById('userInput').value.trim() !== '') {
                    submitQuery();
                }
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
        }

        function toggleMic() {
            if (!recognition || isRequesting) return;
            initInteractions();
            if (isRecording) {
                recognition.stop();
            } else {
                document.getElementById('userInput').value = '';
                recognition.start();
            }
        }

        function stopMic() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            micBtn.classList.remove('bg-red-600');
            micBtn.classList.add('bg-slate-800');
            micBtn.innerText = '🎤';
            document.getElementById('userInput').placeholder = "想跟老公說什麼呢？";
        }

        function showStatus(msg, isError = false) {
            const statusEl = document.getElementById('statusMsg');
            statusEl.innerText = msg;
            statusEl.className = `shrink-0 text-center font-bold mb-2 h-6 text-lg ${isError ? 'text-red-500' : 'text-pink-300'}`;
            statusEl.classList.remove('hidden');
        }

        function hideStatus() {
            document.getElementById('statusMsg').classList.add('hidden');
        }

        // 鎖定/解鎖所有按鈕
        function setButtonsState(disabled) {
            const buttons = document.querySelectorAll('.action-btn');
            buttons.forEach(btn => btn.disabled = disabled);
            document.getElementById('userInput').disabled = disabled;
        }

        function handleQuickAction(topic) {
            if (isRequesting) return;
            document.getElementById('userInput').value = `老公，我現在覺得「${topic}」`;
            submitQuery();
        }

        async function submitQuery() {
            initInteractions();
            
            if (isRequesting) return;
            
            const input = document.getElementById('userInput').value.trim();
            if (!input) {
                showStatus("太座，請先輸入或選擇心情喔！", true);
                return;
            }

            // 鎖定狀態與 UI，防止任何連點
            isRequesting = true;
            setButtonsState(true);

            // UI State change
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('cardCanvas').classList.add('hidden');
            document.getElementById('cardCanvas').classList.remove('opacity-100');
            document.getElementById('ttsContainer').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
            hideStatus();

            const payload = {
                contents: [{ parts: [{ text: input }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            try {
                // 【徹底移除重試機制】單次發送，避免被判定為惡意連線
                const response = await fetch(textModelUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errText = await response.text();
                    if (response.status === 429) {
                        throw new Error("429"); // 明確標示 429
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    currentGeneratedText = data.candidates[0].content.parts[0].text.replace(/\*/g, '');
                    drawCanvasCard(currentGeneratedText);
                    
                    document.getElementById('loading').classList.add('hidden');
                    const canvas = document.getElementById('cardCanvas');
                    canvas.classList.remove('hidden');
                    setTimeout(() => canvas.classList.add('opacity-100'), 50);
                    
                    document.getElementById('ttsContainer').classList.remove('hidden');
                    document.getElementById('userInput').value = ''; 
                } else {
                    throw new Error("回傳格式異常");
                }

            } catch (error) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('placeholder').classList.remove('hidden');
                
                // 溫柔的錯誤提示
                if (error.message.includes("429")) {
                    showStatus("太座請稍等，系統需要喘口氣，請一分鐘後再試❤️", true);
                } else {
                    showStatus(`連線遇到小問題，請稍後再試喔。`, true);
                }
            } finally {
                // 解除鎖定，允許下次查詢
                isRequesting = false;
                setButtonsState(false);
            }
        }

        function drawCanvasCard(text) {
            const canvas = document.getElementById('cardCanvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = 1080;
            canvas.height = 1080; 

            // 1. Background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#1e1b4b'); 
            bgGradient.addColorStop(0.5, '#4c1d95'); 
            bgGradient.addColorStop(1, '#be185d'); 
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Texture
            ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.beginPath(); ctx.arc(200, 200, 400, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(900, 900, 300, 0, Math.PI * 2); ctx.fill();

            // 3. Border
            const margin = 50;
            ctx.strokeStyle = '#fbcfe8'; 
            ctx.lineWidth = 8;
            ctx.strokeRect(margin, margin, canvas.width - margin*2, canvas.height - margin*2);
            ctx.lineWidth = 2;
            ctx.strokeRect(margin + 15, margin + 15, canvas.width - (margin+15)*2, canvas.height - (margin+15)*2);

            // 4. Header
            ctx.fillStyle = '#fbcfe8';
            ctx.font = 'bold 50px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText("💌 來自老公的專屬鼓勵 💌", canvas.width / 2, margin + 50);

            // 5. Content Wrapping
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 46px "Microsoft JhengHei", "PingFang TC", sans-serif';
            ctx.textAlign = 'left';
            
            const maxTextWidth = canvas.width - (margin * 4);
            const lineHeight = 75;
            const startX = margin * 2;
            let currentY = margin + 180;

            const paragraphs = text.split('\n');
            paragraphs.forEach(p => {
                if(p.trim() === '') {
                    currentY += lineHeight / 2;
                    return;
                }
                
                if (p.includes('：') || p.match(/\d+:\d+/)) {
                    ctx.fillStyle = '#fdf2f8'; 
                    ctx.font = 'bold 50px "Microsoft JhengHei", "PingFang TC", sans-serif';
                } else {
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'normal 46px "Microsoft JhengHei", "PingFang TC", sans-serif';
                }

                let line = '';
                for (let i = 0; i < p.length; i++) {
                    const char = p[i];
                    const testLine = line + char;
                    const metrics = ctx.measureText(testLine);
                    
                    if (metrics.width > maxTextWidth && i > 0) {
                        ctx.fillText(line, startX, currentY);
                        line = char;
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, startX, currentY);
                currentY += lineHeight + 20; 
            });

            // 6. Footer
            ctx.fillStyle = 'rgba(251, 207, 232, 0.8)';
            ctx.font = 'italic 40px serif';
            ctx.textAlign = 'right';
            ctx.fillText("永遠愛妳的老公 ❤️", canvas.width - margin * 2, canvas.height - margin - 60);
        }

        async function playTTS() {
            if (!currentGeneratedText) return;

            const ttsBtn = document.getElementById('ttsBtn');
            const originalHtml = ttsBtn.innerHTML;
            ttsBtn.innerHTML = '<div class="w-8 h-8 border-4 border-white border-t-transparent rounded-full animate-spin"></div> <span>老公準備發聲中...</span>';
            ttsBtn.disabled = true;
            hideStatus();

            try {
                const waveAudio = document.getElementById('waveAudio');
                const origVolume = waveAudio.volume;
                waveAudio.volume = 0.1;

                const utterance = new SpeechSynthesisUtterance(currentGeneratedText);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.85; 
                utterance.pitch = 0.9; 

                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('zh') && (v.name.includes('Male') || v.name.includes('男')));
                if (maleVoice) utterance.voice = maleVoice;

                utterance.onend = () => {
                    ttsBtn.innerHTML = originalHtml;
                    ttsBtn.disabled = false;
                    waveAudio.volume = origVolume;
                };

                utterance.onerror = (e) => {
                    console.error(e);
                    ttsBtn.innerHTML = originalHtml;
                    ttsBtn.disabled = false;
                    waveAudio.volume = origVolume;
                    showStatus("語音播放中斷", true);
                };

                window.speechSynthesis.speak(utterance);
                ttsBtn.innerHTML = '🔊 正在溫柔朗讀中...';

            } catch (error) {
                ttsBtn.innerHTML = originalHtml;
                ttsBtn.disabled = false;
                showStatus(`語音啟動失敗: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
