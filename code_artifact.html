<script>
const API_URL =
"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent";

const STORAGE_KEY =
"gemini_api_key";

let busy = false;

/**********************
 API KEY
**********************/
function getApiKey(){

let key =
localStorage.getItem(STORAGE_KEY);

if(!key){

key = prompt(
"第一次請輸入 Gemini API Key"
);

if(key){
localStorage.setItem(
STORAGE_KEY,
key
);
}
}

return key;
}

/**********************
 快捷
**********************/
document.querySelectorAll(".q")
.forEach(btn=>{
btn.onclick=()=>{
input.value = btn.innerText;
};
});

/**********************
 Error
**********************/
function showError(msg){
document.getElementById("error")
.innerText = msg;
}

/**********************
 Mic
**********************/
micBtn.onclick = async()=>{

try{

const SR =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SR){

showError(
"此手機瀏覽器不支援語音辨識"
);

return;
}

// 每次都重新建立
const recognition =
new SR();

recognition.lang = "zh-TW";
recognition.continuous = false;
recognition.interimResults = false;

recognition.onresult = (e)=>{
input.value =
e.results[0][0].transcript;
};

recognition.onerror = (e)=>{
showError(
"語音失敗：\n" +
e.error
);
};

recognition.start();

}catch(err){

showError(err.message);

}
};

/**********************
 Send
**********************/
sendBtn.onclick = async()=>{

if(busy) return;

const text =
input.value.trim();

if(!text){
showError("請輸入內容");
return;
}

busy = true;
showError("");

home.classList.add("hidden");
resultPage.classList.remove("hidden");

result.innerText =
"AI 正在查經中...";

try{

const apiKey = getApiKey();

if(!apiKey){
throw new Error(
"沒有 API KEY"
);
}

const prompt = `
你是中華神學院資深老師，
但不要提到老師。

只用老公口吻。

使用和合本聖經。

主題：
${text}

請輸出：

親愛的玲玲 平安

安慰內容100~200字

【經文】
`;

const res = await fetch(
API_URL + "?key=" + apiKey,
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify({
contents:[
{
parts:[
{
text:prompt
}
]
}
]
})
}
);

const data = await res.json();

if(!res.ok){

throw new Error(
JSON.stringify(data,null,2)
);

}

const output =
data.candidates?.[0]
?.content?.parts?.[0]
?.text;

result.innerText =
output || "沒有回應";

}catch(err){

result.innerText =
"發生錯誤";

showError(
"詳細錯誤：\n\n" +
err.message
);

}finally{

busy = false;

}
};

/**********************
 Speak
**********************/
speakBtn.onclick = ()=>{

speechSynthesis.cancel();

const u =
new SpeechSynthesisUtterance(
result.innerText
);

u.lang = "zh-TW";
u.rate = 0.82;

speechSynthesis.speak(u);

};

/**********************
 Back
**********************/
backBtn.onclick = ()=>{

speechSynthesis.cancel();

resultPage.classList.add(
"hidden"
);

home.classList.remove(
"hidden"
);

};
</script>

</body>
