<!DOCTYPE html>
<html lang="zh-Hant-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太座喜樂查經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: sans-serif; }
        .card-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 overflow-hidden">

    <!-- 初始設定區 -->
    <div id="setup-view" class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-6 text-pink-400">設定您的愛心查經</h1>
        <input type="password" id="api-key" placeholder="請輸入 Gemini API Key" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-600 mb-4 text-white">
        <button onclick="saveApiKey()" class="w-full py-4 bg-pink-600 rounded-lg font-bold text-lg">確認並開始</button>
    </div>

    <!-- 主界面 -->
    <div id="main-view" class="hidden w-full max-w-sm text-center space-y-4">
        <h2 class="text-xl text-pink-300">親愛的玲玲，今天心情如何？</h2>
        <div id="grid" class="grid grid-cols-2 gap-3">
            <!-- 快捷選單 -->
            <button onclick="askAI('心情悶')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">心情悶</button>
            <button onclick="askAI('煩躁忙')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">煩躁忙</button>
            <button onclick="askAI('健康')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">健康</button>
            <button onclick="askAI('家庭')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">家庭</button>
            <button onclick="askAI('親子')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">親子</button>
            <button onclick="askAI('夫妻相處')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">夫妻相處</button>
            <button onclick="askAI('朋友')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">朋友</button>
            <button onclick="askAI('想老公')" class="p-4 bg-gray-800 rounded-xl border border-gray-700">想老公</button>
        </div>
        <button id="mic-btn" onclick="startVoice()" class="w-full py-6 bg-blue-600 rounded-2xl font-bold text-xl mt-4">🎤 語音輸入</button>
    </div>

    <!-- 結果頁面 -->
    <div id="result-view" class="hidden w-full h-full flex flex-col justify-between p-2">
        <div id="card" class="bg-gray-800 p-6 rounded-3xl border-2 border-pink-500 card-shadow overflow-y-auto flex-grow mb-4">
            <h3 class="text-pink-300 font-bold mb-2">親愛的玲玲 平安</h3>
            <div id="result-content" class="text-lg leading-relaxed"></div>
        </div>
        <div class="space-y-3">
            <button id="read-btn" onclick="speakResult()" class="w-full py-5 bg-green-600 rounded-2xl font-bold text-xl">大聲朗讀給太座聽</button>
            <button onclick="showMain()" class="w-full py-5 bg-gray-700 rounded-2xl font-bold text-xl">❤️ 返回重新查詢</button>
        </div>
    </div>

    <script>
        const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=";
        
        function saveApiKey() {
            const key = document.getElementById('api-key').value;
            if(key) { localStorage.setItem('gemini_key', key); showMain(); }
        }

        function showMain() {
            document.getElementById('setup-view').classList.add('hidden');
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
        }

        async function askAI(query) {
            const key = localStorage.getItem('gemini_key');
            const contentDiv = document.getElementById('result-content');
            const resultView = document.getElementById('result-view');
            
            // 鎖定介面
            document.querySelectorAll('button').forEach(b => b.disabled = true);
            contentDiv.innerHTML = "正在向主尋求溫暖安慰...";
            document.getElementById('main-view').classList.add('hidden');
            resultView.classList.remove('hidden');

            try {
                const response = await fetch(API_URL + key, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `你是老公，用溫柔親切的語氣，針對「${query}」這個話題，給予安慰與聖經金句（合和本），字數100~200字。開頭請寫「親愛的玲玲 平安」。直接給內容，不需自我介紹。` }] }]
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message || "發生未知錯誤");
                contentDiv.innerText = data.candidates[0].content.parts[0].text;
            } catch (err) {
                contentDiv.innerHTML = `<span class="text-red-400">連線失敗: ${err.message}</span>`;
            } finally {
                document.querySelectorAll('button').forEach(b => b.disabled = false);
            }
        }

        function startVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("此瀏覽器不支援語音辨識");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.onresult = (e) => askAI(e.results[0][0].transcript);
            recognition.start();
        }

        function speakResult() {
            const text = document.getElementById('result-content').innerText;
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW';
            msg.rate = 0.8; // 緩慢親切
            msg.pitch = 1.0;
            window.speechSynthesis.speak(msg);
        }

        // 初始化
        if (localStorage.getItem('gemini_key')) showMain();
    </script>
</body>
</html>
