<!DOCTYPE html>
<html lang="zh-Hant-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太座喜樂查經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
        { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
</head>
<body class="h-full flex flex-col items-center justify-center p-4 bg-gray-900 text-white overflow-hidden">

    <!-- 設定頁 -->
    <div id="setup-view" class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-bold mb-6 text-pink-400">親愛的玲玲，平安</h1>
        <input type="password" id="apiKey" placeholder="請貼上 API Key" class="w-full p-4 rounded-lg bg-gray-800 border border-gray-600 mb-4 text-white">
        <button id="listBtn" class="w-full py-4 bg-pink-600 rounded-lg font-bold text-lg text-white">鎖定模型並開始</button>
        <div id="status" class="mt-4 p-3 rounded hidden break-words text-sm"></div>
    </div>

    <!-- 主選單 -->
    <div id="main-view" class="hidden w-full max-w-sm text-center space-y-4">
        <h2 id="status-text" class="text-xl text-pink-300">今天心情如何？</h2>
        <div id="voice-transcript" class="p-3 bg-gray-800 rounded-lg italic text-gray-400 min-h-[3rem] border border-gray-700 text-sm">準備聆聽...</div>
        <div class="grid grid-cols-2 gap-3">
            <button onclick="askAI('心情悶')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">心情悶</button>
            <button onclick="askAI('煩躁忙')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">煩躁忙</button>
            <button onclick="askAI('健康')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">健康</button>
            <button onclick="askAI('家庭')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">家庭</button>
            <button onclick="askAI('親子')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">親子</button>
            <button onclick="askAI('夫妻相處')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">夫妻相處</button>
            <button onclick="askAI('朋友')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">朋友</button>
            <button onclick="askAI('想老公')" class="p-4 bg-gray-800 rounded-xl hover:bg-gray-700">想老公</button>
        </div>
        <button id="mic-btn" onclick="startVoice()" class="w-full py-6 bg-blue-600 rounded-2xl font-bold text-xl text-white">🎤 按下麥克風(說完畢送出)</button>
        <button onclick="resetKey()" class="w-full py-2 text-gray-500 underline text-sm">重新設定 API Key</button>
    </div>

    <!-- 結果頁 -->
    <div id="result-view" class="hidden w-full h-full flex flex-col p-2">
        <div class="bg-gray-800 p-6 rounded-3xl border-2 border-pink-500 overflow-y-auto flex-grow mb-4 text-left">
            <h3 class="text-pink-300 font-bold mb-2">親愛的玲玲 平安</h3>
            <div id="result-content" class="text-lg leading-relaxed"></div>
        </div>
        <div class="space-y-3">
            <button id="speak-toggle" onclick="toggleSpeak()" class="w-full py-5 bg-green-600 rounded-2xl font-bold text-xl text-white">🔊 播放朗讀</button>
            <button onclick="showMain()" class="w-full py-5 bg-gray-700 rounded-2xl font-bold text-xl text-white">❤️ 返回</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";
        
        let model;
        const TARGET_MODEL = "gemini-2.5-flash";

        // 清洗 API Key，確保無非法字元
        function sanitizeKey(key) { return key.replace(/[^\x00-\x7F]/g, "").trim(); }

        document.getElementById('listBtn').onclick = async () => {
            const rawKey = document.getElementById('apiKey').value;
            const key = sanitizeKey(rawKey);
            if (!key) return;
            
            try {
                const genAI = new GoogleGenerativeAI(key);
                model = genAI.getGenerativeModel({ model: TARGET_MODEL });
                localStorage.setItem('gemini_key', key);
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
            } catch (e) { alert("Key 初始化失敗: " + e.message); }
        };

        // 指數退避重試邏輯 (Tenacity)
        async function fetchWithRetry(query, attempt = 0) {
            try {
                const prompt = `你是老公，用溫柔語氣安慰並給予金句（合和本），針對「${query}」，約150字。開頭：親愛的玲玲 平安。直接給結果，不要前言。`;
                return await model.generateContent(prompt);
            } catch (err) {
                if (attempt < 4) {
                    await new Promise(r => setTimeout(r, Math.pow(2, attempt) * 1000));
                    return fetchWithRetry(query, attempt + 1);
                }
                throw err;
            }
        }

        window.askAI = async (query) => {
            // 快取機制 (Caching)
            const cacheKey = `cache_${query}`;
            const cached = localStorage.getItem(cacheKey);
            
            document.getElementById('main-view').classList.add('hidden');
            document.getElementById('result-view').classList.remove('hidden');
            const contentDiv = document.getElementById('result-content');

            if (cached) {
                contentDiv.innerText = cached;
                return;
            }

            contentDiv.innerText = "老公正在為妳求告...";
            try {
                const result = await fetchWithRetry(query);
                const text = result.response.text();
                localStorage.setItem(cacheKey, text);
                contentDiv.innerText = text;
            } catch (e) { contentDiv.innerText = "連線失敗: " + e.message; }
        };

        window.startVoice = () => {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'zh-TW';
            rec.interimResults = true;
            rec.onresult = (e) => {
                const text = Array.from(e.results).map(r => r[0].transcript).join('');
                document.getElementById('voice-transcript').innerText = text;
                if(text.includes('完畢')) window.askAI(text.replace('完畢', ''));
            };
            rec.start();
        };

        window.toggleSpeak = () => {
            const msg = new SpeechSynthesisUtterance(document.getElementById('result-content').innerText);
            msg.voice = window.speechSynthesis.getVoices().find(v => v.name.includes('男')) || window.speechSynthesis.getVoices()[0];
            msg.rate = 0.7;
            window.speechSynthesis.speak(msg);
        };

        window.resetKey = () => { localStorage.removeItem('gemini_key'); location.reload(); };
        window.showMain = () => {
            document.getElementById('result-view').classList.add('hidden');
            document.getElementById('main-view').classList.remove('hidden');
            window.speechSynthesis.cancel();
        };

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_key');
            if (savedKey) {
                const genAI = new GoogleGenerativeAI(savedKey);
                model = genAI.getGenerativeModel({ model: TARGET_MODEL });
                document.getElementById('setup-view').classList.add('hidden');
                document.getElementById('main-view').classList.remove('hidden');
            }
        };
    </script>
</body>
</html>
