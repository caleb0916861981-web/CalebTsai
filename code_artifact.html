<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>太座喜樂查經</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html, body { overflow: hidden; height: 100%; width: 100%; position: fixed; touch-action: manipulation; }
        .card-glow { box-shadow: 0 0 30px rgba(251, 191, 36, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col p-4 h-full">

    <header class="h-[10%] flex items-center justify-between">
        <h1 class="text-xl font-bold text-amber-400 tracking-wider">太座喜樂查經</h1>
        <button onclick="openKeyModal()" class="text-2xl p-2">⚙️</button>
    </header>

    <div class="h-[20%] grid grid-cols-4 gap-2 py-2">
        <button onclick="handleQuickSearch('心情悶')" class="bg-slate-800 rounded-lg text-xs font-bold border border-slate-700">心情悶</button>
        <button onclick="handleQuickSearch('煩躁忙')" class="bg-slate-800 rounded-lg text-xs font-bold border border-slate-700">煩躁忙</button>
        <button onclick="handleQuickSearch('健康')" class="bg-slate-800 rounded-lg text-xs font-bold border border-slate-700">健康</button>
        <button onclick="handleQuickSearch('家庭')" class="bg-slate-800 rounded-lg text-xs font-bold border border-slate-700">家庭</button>
    </div>

    <div class="h-[45%] flex flex-col justify-center">
        <div id="card" class="card-glow w-full h-full rounded-2xl bg-slate-900 border border-slate-800 p-6 flex flex-col justify-center text-center">
            <p id="msg" class="text-sm leading-relaxed text-slate-200">親愛的，點選上方分類或按下麥克風，讓老公用神的話語陪伴妳。</p>
            <p id="verse" class="text-xs text-amber-400 mt-4 italic font-serif"></p>
        </div>
    </div>

    <div class="h-[25%] flex flex-col gap-2 pt-4">
        <button id="ttsBtn" onclick="readAloud()" class="hidden w-full bg-pink-700 py-4 rounded-xl font-bold text-sm shadow-lg">🎙️ 朗讀給太座聽</button>
        <button onclick="startVoice()" id="micBtn" class="w-full bg-slate-800 py-4 rounded-xl text-sm font-bold border border-slate-700">🎤 跟老公說說話</button>
    </div>

    <div id="keyModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-6">
        <div class="bg-slate-900 p-6 rounded-2xl w-full max-w-sm border border-slate-700">
            <h3 class="text-amber-400 mb-4 font-bold">API Key 設定</h3>
            <input type="password" id="apiKeyInput" class="w-full bg-black p-3 rounded mb-4 text-white border border-slate-600" placeholder="AIza...">
            <button onclick="saveKey()" class="w-full bg-amber-600 py-3 rounded text-white font-bold">確認儲存</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('wife_bible_key') || "";
        let lastMsg = "", lastVerse = "";

        function openKeyModal() { document.getElementById('keyModal').classList.remove('hidden'); }
        function saveKey() { apiKey = document.getElementById('apiKeyInput').value.trim(); localStorage.setItem('wife_bible_key', apiKey); document.getElementById('keyModal').classList.add('hidden'); }

        async function fetchAI(text, retry = 0) {
            if (!apiKey) return openKeyModal();
            const msgEl = document.getElementById('msg');
            msgEl.textContent = "查經中，請稍候...";
            
            // 修正：將模型更新為 gemini-2.5-flash，這是目前穩定的端點版本
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `作為老公，請給太太溫柔的安慰，並引用一句聖經。格式：安慰內容[SPLIT]聖經金句。問題：${text}` }] }]
                    })
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(`錯誤碼: ${response.status} - ${errData.error?.message || '請確認 API 金鑰是否有效'}`);
                }

                const data = await response.json();
                const parts = data.candidates[0].content.parts[0].text.split("[SPLIT]");
                lastMsg = parts[0]; lastVerse = parts[1];
                msgEl.textContent = lastMsg;
                document.getElementById('verse').textContent = lastVerse;
                document.getElementById('ttsBtn').classList.remove('hidden');
            } catch (err) {
                if (retry < 2) {
                    setTimeout(() => fetchAI(text, retry + 1), 1000);
                } else {
                    msgEl.textContent = "連線異常：" + err.message;
                }
            }
        }

        function handleQuickSearch(f) { fetchAI(`我現在覺得${f}`); }
        
        function readAloud() {
            const u = new SpeechSynthesisUtterance(`親愛的，${lastMsg}。${lastVerse}`);
            u.lang = 'zh-TW';
            window.speechSynthesis.speak(u);
        }

        function startVoice() {
            const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            rec.lang = 'zh-TW';
            rec.onresult = (e) => fetchAI(e.results[0][0].transcript);
            rec.start();
        }
    </script>
</body>
</html>
