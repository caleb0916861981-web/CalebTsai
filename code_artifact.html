<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>太座喜樂查經介面</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fdfbf7',
              100: '#fbf7ed',
              200: '#f4e9cf',
              300: '#eddcb1',
              400: '#e1bf75',
              500: '#d4a338',
              600: '#bf9232',
              700: '#9f7a2a',
              800: '#7f6221',
              900: '#68501b',
            }
          }
        }
      }
    }
  </script>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #030712; /* slate-950 */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    /* 麥克風錄音動態呼吸效果 */
    @keyframes pulse-mic {
      0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(239, 68, 68, 0.4); }
      50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(239, 68, 68, 0.8); }
    }
    .mic-active {
      animation: pulse-mic 1.2s infinite;
      background-color: #ef4444 !important;
    }

    /* 精美電子賀卡發光特效 */
    .premium-card {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98) 0%, rgba(20, 15, 45, 0.98) 100%);
      box-shadow: 0 15px 35px -10px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1), 0 0 25px rgba(212, 163, 56, 0.25);
    }
    
    /* 漸變金文字 */
    .gold-text-gradient {
      background: linear-gradient(to right, #ffe17d, #d4a338, #f5d061);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* 頁面切換過渡動畫 */
    .screen-transition {
      transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
    }
    .screen-hidden {
      opacity: 0;
      transform: scale(0.97);
      pointer-events: none;
      position: absolute;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body class="text-slate-100 flex flex-col justify-between h-full w-full select-none">

  <header class="h-[8%] flex items-center justify-between px-4 bg-slate-900/70 border-b border-slate-800/80 backdrop-blur-md shrink-0 z-10">
    <div class="flex items-center gap-2">
      <!-- 溫暖愛心圖示 -->
      <svg class="w-6 h-6 text-rose-500 fill-current animate-pulse" viewBox="0 0 24 24">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
      <h1 class="text-lg md:text-xl font-bold tracking-wider gold-text-gradient">太座喜樂查經</h1>
    </div>
    <div class="flex items-center gap-3">
      <!-- 背景音樂合成演奏開關 -->
      <button id="musicToggleBtn" onclick="toggleBackgroundMusic()" class="py-1.5 px-3 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all flex items-center gap-1.5 text-xs font-semibold">
        <span id="musicIcon">🔇</span>
        <span id="musicStatus">愛的真諦:關</span>
      </button>
      <!-- 金鑰管理按鈕 -->
      <button onclick="showKeyModal()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all" title="設定金鑰">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      </button>
    </div>
  </header>

  <!-- 主內容視窗容器 (自適應一頁，無捲動) -->
  <main class="flex-1 relative w-full overflow-hidden">

    <div id="searchScreen" class="screen-transition h-full w-full flex flex-col justify-between p-4">
      
      <!-- 快捷查經 8 大區塊 -->
      <div class="flex-1 flex flex-col justify-center gap-2">
        <div class="text-center mb-2">
          <span class="text-sm text-amber-300/90 font-medium">✨ 親愛的，點選妳此時的心境，讓神安慰妳：</span>
        </div>
        
        <!-- 巨型按鈕網路 -->
        <div class="grid grid-cols-2 gap-3 max-w-md mx-auto w-full">
          <button onclick="quickSearch('心情悶')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">🌧️</span>
            <span class="text-base font-bold text-slate-100">心情有些悶</span>
          </button>
          <button onclick="quickSearch('煩躁忙')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">⚡</span>
            <span class="text-base font-bold text-slate-100">感到煩躁忙</span>
          </button>
          <button onclick="quickSearch('健康')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">🩺</span>
            <span class="text-base font-bold text-slate-100">求身體健康</span>
          </button>
          <button onclick="quickSearch('家庭')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">🏠</span>
            <span class="text-base font-bold text-slate-100">求家庭和樂</span>
          </button>
          <button onclick="quickSearch('親子')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">👶</span>
            <span class="text-base font-bold text-slate-100">育親子智慧</span>
          </button>
          <button onclick="quickSearch('夫妻相處')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">💖</span>
            <span class="text-base font-bold text-slate-100">談夫妻相處</span>
          </button>
          <button onclick="quickSearch('朋友')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">🤝</span>
            <span class="text-base font-bold text-slate-100">交朋友互動</span>
          </button>
          <button onclick="quickSearch('想老公')" class="quick-btn h-16 flex items-center gap-3 bg-slate-900/90 hover:bg-slate-850 border border-slate-700/60 rounded-2xl p-3 active:scale-95 transition-all">
            <span class="text-3xl">💌</span>
            <span class="text-base font-bold text-slate-100">今天想老公</span>
          </button>
        </div>
      </div>

      <!-- 輸入控制欄位 -->
      <div class="mt-4 flex items-center gap-3 max-w-md mx-auto w-full pb-4">
        <!-- 麥克風輸入 -->
        <button id="micBtn" onclick="toggleSpeech()" class="h-14 w-14 rounded-full bg-amber-500 hover:bg-amber-600 flex items-center justify-center shrink-0 transition-all shadow-lg shadow-amber-500/20 active:scale-95" title="語音輸入">
          <svg id="micIcon" class="w-7 h-7 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
          </svg>
        </button>
        <!-- 文字與發送 -->
        <div class="flex-1 flex items-center bg-slate-900 border border-slate-700/80 rounded-full h-14 px-4 focus-within:border-amber-500 transition-all shadow-inner">
          <input id="userInput" type="text" placeholder="跟老公說點心事，或按麥克風..." class="bg-transparent flex-1 outline-none text-base text-slate-100 placeholder-slate-500">
          <button id="sendBtn" onclick="triggerSearch()" class="p-2 rounded-full bg-slate-800 hover:bg-slate-700 text-amber-400 active:scale-95" title="發送詢問">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div id="resultScreen" class="screen-transition screen-hidden h-full w-full flex flex-col justify-between p-4">
      
      <!-- 賀卡主體 -->
      <div id="cardContainer" class="premium-card rounded-3xl border border-amber-500/35 p-5 flex-1 flex flex-col justify-between overflow-hidden relative">
        <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,rgba(212,163,56,0.08),transparent_65%)] pointer-events-none"></div>
        
        <!-- 卡片內容滾動防溢出 -->
        <div class="overflow-y-auto flex-1 flex flex-col justify-center text-center py-2 px-1" id="cardContentScroll">
          <div id="cardContent" class="space-y-4">
            <!-- 內容由此動態生成 -->
          </div>
        </div>

        <!-- 朗讀控制 & 返回區 -->
        <div class="pt-4 border-t border-slate-800/80 flex flex-col gap-3 shrink-0">
          <!-- 巨型朗讀按鈕 -->
          <button id="ttsBtn" onclick="speakOutput()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-98 text-slate-950 font-bold text-xl flex items-center justify-center gap-3 shadow-xl shadow-amber-500/25 transition-all">
            <span class="text-2xl">🗣️</span>
            <span>大聲朗讀給太座聽 💖</span>
          </button>
          
          <!-- 愛心返回按鈕 -->
          <button onclick="goBackToSearch()" class="py-2.5 px-6 rounded-xl bg-slate-900/90 border border-slate-700 hover:bg-slate-800 text-rose-400 font-semibold text-sm flex items-center justify-center gap-2 transition-all active:scale-95">
            <span>❤️</span>
            <span>回到重新查詢</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="loadingOverlay" class="hidden absolute inset-0 bg-slate-950/85 backdrop-blur-md flex flex-col items-center justify-center z-50">
    <div class="relative flex items-center justify-center mb-6">
      <div class="animate-spin rounded-full h-20 w-20 border-t-4 border-b-4 border-amber-500"></div>
      <span class="absolute text-2xl animate-bounce">❤️</span>
    </div>
    <p id="loadingText" class="text-amber-300 font-bold text-xl animate-pulse text-center px-6 leading-relaxed">
      老公正在為妳翻查聖經求亮光，等我一下喔...
    </p>
  </div>

  <div id="keyModal" class="hidden fixed inset-0 bg-slate-950/95 backdrop-blur-xl flex items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl max-w-sm w-full p-6 space-y-5 shadow-2xl">
      <div class="text-center">
        <span class="text-4xl">🔑</span>
        <h3 class="text-xl font-bold text-amber-300 mt-2">設定 Gemini API 金鑰</h3>
        <p class="text-xs text-slate-400 mt-2 leading-relaxed">
          為保護隱私，您的金鑰將儲存在此瀏覽器本機。更新網頁或程式碼不需重複輸入。
        </p>
      </div>
      <div>
        <input id="apiKeyInput" type="password" placeholder="請貼上您的 Gemini API Key" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 outline-none focus:border-amber-500">
      </div>
      <div class="flex gap-3">
        <button onclick="saveApiKey()" class="flex-1 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold transition-all text-sm">儲存金鑰</button>
        <button onclick="hideKeyModal()" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all text-sm">取消</button>
      </div>
    </div>
  </div>

  <!-- 提示浮動訊息 (Toast) -->
  <div id="toast" class="opacity-0 pointer-events-none fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-amber-500/50 text-amber-300 text-xs px-5 py-3 rounded-full shadow-2xl transition-all duration-300 z-50 flex items-center gap-2">
    <span>💡</span>
    <span id="toastMsg"></span>
  </div>

  <script>
    // 固定的本機儲存 Key
    const STORAGE_KEY = "WIFE_DEVOTIONAL_GEMINI_KEY";
    let geminiApiKey = localStorage.getItem(STORAGE_KEY) || "";

    // 內部提示詞定義 (老公角色、神學院深度、和合本金句，字數 100~200 字)
    const systemPrompt = `你是中華神學院的資深教授老師，此時你只扮演最體貼溫柔的老公。
你的所有回覆深度與神學啟發，都必須參考並符合網頁 ccbible 查經網站（https://ccbiblestudy.net/index-T.htm）所強調的：靈修培育、讀經扎根與和合本聖經真理。

請依照下列嚴格格式輸出：
1. 第一段：以老公溫暖、極具同理心、緩慢且親切的語調，寫出 100~200 字的安慰打氣話語。必須貼合太座提問的心境，給予全然的接納與支持，不要有任何前言、老公的自我介紹。
2. 空一行。
3. 第二段：引用一句最貼切的聖經和合本經文，並在括號內附上精確的卷章節（例如：腓立比書 4:6-7）。

回覆限制：絕對不要寫任何開頭問候語(如"老婆好")或結尾語，也不需要提及你是神學院老師。直接輸出上述兩段內容。`;

    // 語音輸入變數
    let recognition = null;
    let isListening = false;

    // 音樂合成器變數
    let audioCtx = null;
    let isMusicPlaying = false;
    let nextNoteTimeout = null;

    // C大調經典旋律 (1=C4, 2=D4, 3=E4, 4=F4, 5=G4, 6=A4, 7=B4, i=C5)
    const lovesTruthMelody = [
      { note: "E4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "A4", dur: 1.0 }, // 愛是恆久
      { note: "G4", dur: 1.0 }, { note: "E4", dur: 1.5 }, { note: "D4", dur: 0.5 }, { note: "E4", dur: 1.0 }, // 忍耐又有
      { note: "G4", dur: 1.0 }, { note: "D4", dur: 3.0 }, // 恩慈
      { note: "E4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "A4", dur: 1.0 }, // 愛是不嫉
      { note: "G4", dur: 1.0 }, { note: "E4", dur: 1.5 }, { note: "D4", dur: 0.5 }, { note: "E4", dur: 1.0 }, // 妒愛是不
      { note: "G4", dur: 1.0 }, { note: "D4", dur: 1.0 }, { note: "C4", dur: 3.0 }, // 自誇不張狂
      { note: "A4", dur: 1.0 }, { note: "C5", dur: 1.0 }, { note: "C5", dur: 1.0 }, { note: "A4", dur: 1.0 }, // 不做害羞
      { note: "G4", dur: 1.0 }, { note: "E4", dur: 1.5 }, { note: "D4", dur: 0.5 }, { note: "E4", dur: 1.0 }, // 的事不求
      { note: "G4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "D4", dur: 3.0 }, // 自己的益處
      { note: "E4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "G4", dur: 1.0 }, { note: "A4", dur: 1.0 }, // 不輕易發
      { note: "G4", dur: 1.0 }, { note: "E4", dur: 1.5 }, { note: "D4", dur: 0.5 }, { note: "E4", dur: 1.0 }, // 怒不計算
      { note: "G4", dur: 1.0 }, { note: "D4", dur: 1.0 }, { note: "C4", dur: 3.0 }  // 人的惡
    ];

    const noteFreqs = {
      "C4": 261.63, "D4": 293.66, "E4": 329.63, "F4": 349.23,
      "G4": 392.00, "A4": 440.00, "B4": 493.88, "C5": 523.25
    };

    window.onload = function() {
      if (!geminiApiKey) {
        setTimeout(() => { showKeyModal(); }, 800);
      } else {
        showToast("已成功讀取裝置儲存的 API 金鑰");
      }
      initSpeechRecognition();
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      toastMsg.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3500);
    }

    // Key Modal 管理
    function showKeyModal() {
      document.getElementById('apiKeyInput').value = geminiApiKey;
      document.getElementById('keyModal').classList.remove('hidden');
    }
    function hideKeyModal() {
      document.getElementById('keyModal').classList.add('hidden');
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (!val) {
        showToast("請輸入有效的 Gemini 金鑰喔！");
        return;
      }
      geminiApiKey = val;
      localStorage.setItem(STORAGE_KEY, val);
      showToast("金鑰已儲存！同裝置程式更新免重輸。");
      hideKeyModal();
    }

    function toggleBackgroundMusic() {
      if (isMusicPlaying) {
        stopBackgroundMusic();
      } else {
        startBackgroundMusic();
      }
    }

    function startBackgroundMusic() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        isMusicPlaying = true;
        document.getElementById('musicIcon').innerText = "🔊";
        document.getElementById('musicStatus').innerText = "愛的真諦:開";
        showToast("配樂《愛的真諦》演奏中...");

        let noteIndex = 0;
        const tempo = 120; // 速度
        const beatDuration = 60 / tempo; // 每拍秒數

        function playNextNote() {
          if (!isMusicPlaying) return;

          const current = lovesTruthMelody[noteIndex];
          const freq = noteFreqs[current.note];
          const duration = current.dur * beatDuration;

          if (freq) {
            // 創建振盪器 (採用溫和的三角波)
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            // 溫和且低沉的背景音量設計 (0.015 ~ 0.025 防止喧賓奪主)
            gainNode.gain.setValueAtTime(0.02, audioCtx.currentTime);
            // 輕微的釋放衰減效果，避免爆音
            gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration - 0.02);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
          }

          noteIndex = (noteIndex + 1) % lovesTruthMelody.length;
          nextNoteTimeout = setTimeout(playNextNote, duration * 1000);
        }

        playNextNote();
      } catch (e) {
        console.error("音樂合成失敗:", e);
        showToast("您的瀏覽器暫不支援 Web Audio 合成音效");
      }
    }

    function stopBackgroundMusic() {
      isMusicPlaying = false;
      if (nextNoteTimeout) clearTimeout(nextNoteTimeout);
      document.getElementById('musicIcon').innerText = "🔇";
      document.getElementById('musicStatus').innerText = "愛的真諦:關";
      showToast("背景配樂已靜音");
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        console.warn("裝置不支援 SpeechRecognition 語音介面");
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'zh-TW';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = function() {
        isListening = true;
        document.getElementById('micBtn').classList.add('mic-active');
        document.getElementById('userInput').placeholder = "傾聽中...請說出您的心情...";
      };

      recognition.onerror = function(e) {
        console.error("語音輸入錯誤:", e.error);
        stopSpeechUI();
        if (e.error === 'not-allowed') {
          showToast("麥克風權限被拒絕，請在系統設定中開啟權限");
        } else if (e.error === 'no-speech') {
          showToast("沒有偵測到您的聲音，請大聲一點或手動輸入");
        } else {
          showToast("語音辨識出錯，請用鍵盤手動輸入喔");
        }
      };

      recognition.onend = function() {
        stopSpeechUI();
      };

      recognition.onresult = function(event) {
        const text = event.results[0][0].transcript;
        document.getElementById('userInput').value = text;
        showToast("已辨識：" + text);
        triggerSearch();
      };
    }

    function toggleSpeech() {
      if (!recognition) {
        showToast("此裝置的瀏覽器未開放或不支援麥克風語音輸入");
        return;
      }
      
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function stopSpeechUI() {
      isListening = false;
      document.getElementById('micBtn').classList.remove('mic-active');
      document.getElementById('userInput').placeholder = "跟老公說點心事，或按麥克風...";
    }

    function quickSearch(theme) {
      let promptText = "";
      switch(theme) {
        case '心情悶': promptText = "親愛的老公，我今天心情有點悶，提不起勁來，需要你的溫柔安慰與一劑聖經金句。"; break;
        case '煩躁忙': promptText = "親愛的老公，今天生活好忙亂好煩躁，思緒靜不下來，求主的話語賜下平靜。"; break;
        case '健康': promptText = "親愛的老公，最近身體有些不適與疲憊，求主看顧醫治並賜予力量。"; break;
        case '家庭': promptText = "親愛的老公，家裡的大小事繁多，求主保守我們家充滿和樂、平靜與智慧。"; break;
        case '親子': promptText = "親愛的老公，教導大學孩子需要更多的智慧，求主指引我學會合適的交託與放手。"; break;
        case '夫妻相處': promptText = "親愛的老公，求主看顧我們夫妻的心靈，讓我們在主愛裡持續合一、互相包容扶持。"; break;
        case '朋友': promptText = "親愛的老公，求主賜給我與朋友相處的智慧，充滿恩慈與智慧的應對。"; break;
        case '想老公': promptText = "親愛的老公，我今天特別想你，求你對我說幾句深情溫暖的打氣話語。"; break;
        default: promptText = `我想查考關於：${theme}`;
      }
      document.getElementById('userInput').value = promptText;
      triggerSearch();
    }

    function triggerSearch() {
      const text = document.getElementById('userInput').value.trim();
      if (!text) {
        showToast("請先輸入您的心境或查考方向喔");
        return;
      }
      if (!geminiApiKey) {
        showToast("請先點選右上角設定金鑰");
        showKeyModal();
        return;
      }
      executeGeminiQuery(text);
    }

    // 介面鎖定控制 (防止重複發送與搶佔)
    function setInterfaceLocked(locked) {
      const overlay = document.getElementById('loadingOverlay');
      const micBtn = document.getElementById('micBtn');
      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');
      const quickBtns = document.querySelectorAll('.quick-btn');

      if (locked) {
        overlay.classList.remove('hidden');
        micBtn.disabled = true;
        sendBtn.disabled = true;
        userInput.disabled = true;
        quickBtns.forEach(btn => btn.disabled = true);
      } else {
        overlay.classList.add('hidden');
        micBtn.disabled = false;
        sendBtn.disabled = false;
        userInput.disabled = false;
        quickBtns.forEach(btn => btn.disabled = false);
      }
    }

    async function fetchWithRetry(url, options, retries = 5, delay = 1000) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          if (response.status === 400 || response.status === 403 || response.status === 404 || response.status === 429) {
            throw response; // 特定 API 級別錯誤直接拋出不空耗重試
          }
          if (retries > 0) {
            await new Promise(res => setTimeout(res, delay));
            return await fetchWithRetry(url, options, retries - 1, delay * 2);
          }
          throw response;
        }
        return response;
      } catch (error) {
        if (retries > 0 && !(error instanceof Response)) {
          // 網路層斷線才進行重試
          await new Promise(res => setTimeout(res, delay));
          return await fetchWithRetry(url, options, retries - 1, delay * 2);
        }
        throw error;
      }
    }

    async function executeGeminiQuery(userQuery) {
      setInterfaceLocked(true);

      // 自動同步重啟背景音樂，創造沉浸式查經氛圍
      if (!isMusicPlaying && audioCtx && audioCtx.state === 'suspended') {
        startBackgroundMusic();
      }

      // 模型降級輪替鏈：將相容性最高、無限制的 1.5 系列排在首位，防止 404
      const models = [
        "gemini-1.5-flash",
        "gemini-2.5-flash",
        "gemini-1.5-pro",
        "gemini-2.5-flash-preview-09-2025"
      ];

      let lastError = null;
      let success = false;

      for (let i = 0; i < models.length; i++) {
        const model = models[i];
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiApiKey}`;

        // 動態更換載入進度提示
        let loadingMsg = "老公正在為妳翻查聖經求亮光，等我一下喔...";
        if (i > 0) {
          loadingMsg = "老公正在深入尋找最能契合妳心境的智慧經卷，再等我一下下喔...";
        }
        document.getElementById('loadingText').innerText = loadingMsg;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        try {
          const maxRetries = (i === 0) ? 3 : 1; // 首選模型重試3次，後續備用模型重試1次
          const response = await fetchWithRetry(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          }, maxRetries, 800);

          const result = await response.json();
          const responseText = result.candidates?.[0]?.content?.parts?.[0]?.text;

          if (responseText) {
            displayResultCard(responseText);
            success = true;
            break; // 成功獲得成果，跳出輪替鏈
          } else {
            throw new Error("Format error");
          }
        } catch (err) {
          console.warn(`[自動調度] 模型 ${model} 連線失敗，嘗試下一級備用。錯誤：`, err);
          lastError = err;
          // 若遭遇模型找不到 (404)、未授權 (403)、壞請求 (400) 等，直接往下一個模型輪替
          continue;
        }
      }

      if (!success) {
        handleFinalError(lastError);
      }

      setInterfaceLocked(false);
    }

    // 處理最終解析錯誤與防呆
    function handleFinalError(err) {
      if (err instanceof Response) {
        const statusCode = err.status;
        let title = "連線失敗";
        let explanation = "";

        switch (statusCode) {
          case 400:
            title = "金鑰格式有誤 (400 Bad Request)";
            explanation = "您的 API 金鑰長度或格式似乎不正確，請點選右上角齒輪按鈕重新輸入。";
            break;
          case 403:
            title = "金鑰無效或受限 (403 Forbidden)";
            explanation = "此 API Key 無權限。請確認金鑰是否輸入正確，或前往 Google AI Studio 檢查金鑰狀態。";
            break;
          case 404:
            title = "模型端點找不到 (404 Not Found)";
            explanation = "Gemini 伺服器回報 404。此 Key 的方案未開通我們所使用的全部模型，請嘗試在 AI Studio 中為此專案重新建立一組 Key！";
            break;
          case 429:
            title = "AI 請求額度用盡 (429 Rate Limit)";
            explanation = "今日免費存取次數已達上限，請稍微休息幾分鐘後再試試。";
            break;
          default:
            title = `伺服器連線錯誤 (代碼: ${statusCode})`;
            explanation = "發生了未知的伺服器通訊錯誤，請稍後再試。";
        }
        showDebugError(title, explanation);
      } else {
        showDebugError(
          "網路連線中斷或受阻",
          "可能是手機目前沒有網際網路連線，或者是您的網域/CORS 遭防火牆或系統阻擋。請檢查網路連線。"
        );
      }
    }

    function displayResultCard(text) {
      const cardContent = document.getElementById('cardContent');
      const paragraphs = text.split('\n').filter(p => p.trim() !== '');

      let htmlContent = `<div class="space-y-4">`;
      htmlContent += `<div class="text-xs tracking-widest text-amber-500/80 font-bold uppercase">Dearest Wife • 專屬安慰</div>`;

      paragraphs.forEach((p, idx) => {
        // 判定聖經經句格式（有卷章節標記）
        if (p.includes('(') || p.includes('（') || p.includes('：') || p.includes(':') || idx === paragraphs.length - 1) {
          htmlContent += `
            <div class="my-3 p-4 rounded-2xl bg-slate-900/90 border-l-4 border-amber-500 shadow-md">
              <p class="text-amber-200 text-base md:text-lg font-medium leading-relaxed italic">「 ${p} 」</p>
            </div>
          `;
        } else {
          // 一般溫和的老公同理打氣話語
          htmlContent += `
            <p class="text-slate-100 text-lg font-semibold leading-relaxed drop-shadow text-justify">
              ${p}
            </p>
          `;
        }
      });

      htmlContent += `</div>`;
      cardContent.innerHTML = htmlContent;

      // 切換至全新頁面
      switchScreen('result');
      // 清空輸入框
      document.getElementById('userInput').value = "";
    }

    function showDebugError(title, explanation) {
      const cardContent = document.getElementById('cardContent');
      
      cardContent.innerHTML = `
        <div class="p-4 rounded-2xl bg-rose-950/40 border border-rose-500/40 text-center space-y-4">
          <div class="text-4xl">⚠️</div>
          <h3 class="text-lg font-bold text-rose-300">${title}</h3>
          <p class="text-sm text-slate-300 leading-relaxed">${explanation}</p>
          <div class="pt-2 flex justify-center gap-3">
            <button onclick="goBackToSearch()" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all">
              重新輸入
            </button>
            <button onclick="showKeyModal()" class="px-5 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-slate-950 text-xs font-bold transition-all">
              更換 API Key
            </button>
          </div>
        </div>
      `;
      switchScreen('result');
    }

    // 雙頁面切換控制
    function switchScreen(screen) {
      const searchScreen = document.getElementById('searchScreen');
      const resultScreen = document.getElementById('resultScreen');

      if (screen === 'search') {
        resultScreen.classList.add('screen-hidden');
        searchScreen.classList.remove('screen-hidden');
      } else {
        searchScreen.classList.add('screen-hidden');
        resultScreen.classList.remove('screen-hidden');
      }
    }

    function goBackToSearch() {
      // 回到首頁前，先安靜取消所有正在進行的語音朗讀
      window.speechSynthesis.cancel();
      switchScreen('search');
    }

    let currentUtterance = null;

    function speakOutput() {
      window.speechSynthesis.cancel();

      const cardContentText = document.getElementById('cardContent').innerText;
      // 去除純排版語義字元
      const textToSpeak = cardContentText
        .replace("Dearest Wife • 專屬安慰", "")
        .replace(/「/g, "")
        .replace(/」/g, "")
        .trim();

      if (!textToSpeak) return;

      currentUtterance = new SpeechSynthesisUtterance(textToSpeak);
      // 精心設計的老公語氣參數：緩慢、渾厚、極具溫柔感
      currentUtterance.rate = 0.80;   // 緩慢安祥
      currentUtterance.pitch = 0.88;  // 略微低沉、溫暖、有磁性

      // 選擇最優的中文發音語音
      const voices = window.speechSynthesis.getVoices();
      let selectedVoice = null;
      
      for (let i = 0; i < voices.length; i++) {
        const v = voices[i];
        if (v.lang.includes('zh-TW') || v.lang.includes('zh-HK') || v.lang.includes('zh-CN')) {
          if (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('david') || v.name.toLowerCase().includes('yating')) {
            selectedVoice = v;
            break;
          }
          if (!selectedVoice) selectedVoice = v;
        }
      }
      
      if (selectedVoice) {
        currentUtterance.voice = selectedVoice;
      }

      const ttsBtn = document.getElementById('ttsBtn');
      const originalHtml = ttsBtn.innerHTML;
      
      currentUtterance.onstart = function() {
        ttsBtn.innerHTML = `
          <span class="animate-pulse">❤️ 老公正深情朗讀中... (點此停止)</span>
        `;
        ttsBtn.classList.remove('from-amber-500', 'to-amber-600');
        ttsBtn.classList.add('from-rose-500', 'to-rose-600');
      };

      currentUtterance.onend = function() {
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      currentUtterance.onerror = function() {
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      // 再次點擊大聲朗讀鍵可中途停止
      ttsBtn.onclick = function() {
        window.speechSynthesis.cancel();
        ttsBtn.innerHTML = originalHtml;
        ttsBtn.classList.remove('from-rose-500', 'to-rose-600');
        ttsBtn.classList.add('from-amber-500', 'to-amber-600');
        ttsBtn.onclick = speakOutput;
      };

      window.speechSynthesis.speak(currentUtterance);
    }

    if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = () => {};
    }
  </script>
